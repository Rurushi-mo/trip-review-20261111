  addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(resize)});

  function pathBetween(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;return `M ${a.x+dx/d*(a.r+4)} ${a.y+dy/d*(a.r+4)} L ${b.x-dx/d*(b.r+4)} ${b.y-dy/d*(b.r+4)}`}

  function tick(now,dt){
